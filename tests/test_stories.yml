          - problema: mudanca_plano
      - action: action_fornecer_suporte
      - action: utter_perguntar_problema_resolvido
      - intent: confirmar_resolucao
      - action: utter_problema_resolvido

  - story: TESTE cancelamento escala diretamente
    steps:
      - intent: relatar_cancelamento
        entities:
          - problema: cancelamento
      - action: action_fornecer_suporte
      - action: action_escalar_atendente

  - story: TESTE solicitacao direta atendente
    steps:
      - intent: solicitar_atendente_humano
      - action: action_escalar_atendente

  - story: TESTE fora do escopo
    steps:
      - intent: fora_do_escopo
      - action: utter_fora_do_escopo

  - story: TESTE app problema resolvido
    steps:
      - intent: saudacao
      - action: utter_saudacao
      - intent: relatar_problema_app
        entities:
          - problema: falha_app
      - action: action_fornecer_suporte
      - action: utter_perguntar_problema_resolvido
      - intent: confirmar_resolucao
      - action: utter_problema_resolvido
      - intent: despedida
      - action: utter_despedida
