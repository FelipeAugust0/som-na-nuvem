version: "3.1"

stories:

  - story: TESTE acesso conta resolvido
    steps:
      - intent: saudacao
      - action: utter_saudacao
      - intent: relatar_problema_acesso
        entities:
          - problema: acesso_conta
      - action: action_fornecer_suporte
      - action: utter_perguntar_problema_resolvido
      - intent: confirmar_resolucao
      - action: utter_problema_resolvido
      - action: utter_despedida

  - story: TESTE acesso nao resolvido escalamento
